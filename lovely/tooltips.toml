[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Attach The Devil effect tooltips to the blind-select badge.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
  blind_choice.animation:define_draw_steps({
    {shader = 'dissolve', shadow_height = 0.05},
    {shader = 'dissolve'}
  })
'''
position = "after"
payload = '''
  if HNDS and HNDS.attach_devil_blind_tooltip then
    HNDS.attach_devil_blind_tooltip(blind_choice.animation, blind_choice.config)
  end
'''
match_indent = true
times = 1
